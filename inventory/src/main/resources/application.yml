server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    # 🔄 Localhost testing URL with production Docker URL commented out below
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicine_locator_db}
    # url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${SPRING_DATASOURCE_USERNAME:medicine_user}
    password: ${SPRING_DATASOURCE_PASSWORD:medicine_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # 🔄 Temporarily changed to update so tables are generated on localhost if they don't exist yet
      ddl-auto: update
      # ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # 👇 Added local decoupling switches to stop background check verification crashes
  health:
    redis:
      enabled: false          # Disable standard indicator
    reactive:
      redis:
        enabled: false        # Disable reactive background database indicator

inventory:
  cache:
    medicine-ttl-seconds: 300
    inventory-ttl-seconds: 120

logging:
  level:
    com.medicinelocator.inventory: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"