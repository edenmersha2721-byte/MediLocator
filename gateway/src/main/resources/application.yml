server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # Redis Rate Limiter is temporarily disabled until you have a Redis server running
      # default-filters:
      #   - name: RequestRateLimiter
      #     args:
      #       redis-rate-limiter.replenishRate: 20
      #       redis-rate-limiter.burstCapacity: 40
      #       redis-rate-limiter.requestedTokens: 1

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          # 👇 COMMENTED THIS OUT SO IT STOPS LOOKING FOR THE MISSING CIRCUIT BREAKER FACTORY
          # filters:
          #   - name: CircuitBreaker
          #     args:
          #       name: auth-service
          #       fallbackUri: forward:/fallback/auth

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
          # filters:
          #   - JwtAuth

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/search/**
          # filters:
          #   - JwtAuth

        - id: prescription-service
          uri: ${PRESCRIPTION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/prescriptions/**
          # filters:
          #   - JwtAuth

        - id: reservation-service
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/reservations/**
          # filters:
          #   - JwtAuth

jwt:
  # Added a long 256-bit safe fallback string to prevent HMAC verification validation crashes locally
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LWtleS1mb3ItbG9jYWwtdGVzdGluZy0xMjM0NTY3ODk=}

rate-limit:
  default-replenish-rate: 20
  default-burst-capacity: 40

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
    reactive:
      redis:
        enabled: false

logging:
  level:
    com.medicinelocator.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"