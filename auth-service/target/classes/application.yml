server:
  port: 8081

spring:
  application:
    name: auth-service

  # === Original Datasource (commented out) ===
  # datasource:
  #   url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
  #   username: ${SPRING_DATASOURCE_USERNAME:medicine_user}
  #   password: ${SPRING_DATASOURCE_PASSWORD:medicine_pass}

  # === New Datasource Configuration ===
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: Edu27015
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update        # Changed from validate to update for local testing
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  data:
    redis:
      host: localhost
      port: 6379
      # password: ${REDIS_PASSWORD:}     # Commented - using no password for now

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

jwt:
  # secret: ${JWT_SECRET}               # Original (commented)
  secret: mySuperLongSecretKeyForHS512ThatIsAtLeast64CharactersLongEdu27015MedicineLocator2026
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  email-verification-expiry-hours: 24
  password-reset-expiry-hours: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.medicinelocator.auth: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"