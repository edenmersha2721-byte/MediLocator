server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # 🔄 Localhost testing URL with production Docker URL commented out below
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicine_locator_db}
    # url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${SPRING_DATASOURCE_USERNAME:medicine_user}
    password: ${SPRING_DATASOURCE_PASSWORD:medicine_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # Use update/validate safely depending on whether your schema is fully loaded yet
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    # 🔄 Provided standard developer placeholder strings so context initialization won't fail
    username: ${SPRING_MAIL_USERNAME:dev-testing-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:dev-testing-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

jwt:
  # 🔄 Added a standard local 256-bit fallback key below to prevent validation failures at boot time
  secret: ${JWT_SECRET:change_me_at_least_64_chars_long_secret_key_for_hs512_algorithm_here}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  email-verification-expiry-hours: 24
  password-reset-expiry-hours: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # 👇 Added health indicator bypass switches to prevent context failures when background services are offline
  health:
    redis:
      enabled: false          # Disable standard indicator
    mail:
      enabled: false          # Disable mail health check indicator
    reactive:
      redis:
        enabled: false        # Disable reactive background data indicator

logging:
  level:
    com.medicinelocator.auth: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"