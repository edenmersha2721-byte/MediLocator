server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # ❌ OLD WRONG CONFIG (kept for reference)
    # url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    # username: ${SPRING_DATASOURCE_USERNAME:medicine_user}
    # password: ${SPRING_DATASOURCE_PASSWORD:medicine_pass}

    # ✅ FIXED CONFIG (WORKING - matches your setup)
    url: jdbc:postgresql://localhost:5432/auth-db
    username: postgres
    password: Edu27015
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update   # changed from validate → update for development
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:edenmersha2721@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:oizwzwoquzirpzje}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

jwt:
  secret: Y2hhbmdlX21lX2F0X2xlYXN0XzY0X2NoYXJzX2xvbmdfc2VjcmV0X2tleV9mb3JfaHM1MTJfYWxnb3JpdGhtX2hlcmU=
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  email-verification-expiry-hours: 24
  password-reset-expiry-hours: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

  health:
    redis:
      enabled: false
    mail:
      enabled: false
    reactive:
      redis:
        enabled: false

logging:
  level:
    com.medicinelocator.auth: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"